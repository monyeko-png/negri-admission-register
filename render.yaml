services:
  - type: web
    name: negri-admission-register
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    disk:
      name: negri-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
    envVars:
      - key: DATABASE_PATH
        value: /opt/render/project/src/data/negri.db
